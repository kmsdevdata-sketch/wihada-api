spring:
  application:
    name: p3-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:p3}
    username: ${POSTGRES_USER:p3}
    password: ${POSTGRES_PASSWORD:p3}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}

  mail:
    host: ${GMAIL_SMTP_HOST:smtp.gmail.com}
    port: ${GMAIL_SMTP_PORT:587}
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

management:
  endpoint:
    health:
      probes:
        enabled: true

p3:
  account:
    encryption:
      key: ${P3_ACCOUNT_ENCRYPTION_KEY:}
      key-version: ${P3_ACCOUNT_ENCRYPTION_KEY_VERSION:v1}

  kftc:
    verification-enabled: ${P3_KFTC_VERIFICATION_ENABLED:true}
    auth-base-url: ${P3_KFTC_AUTH_BASE_URL:https://openapi.openbanking.or.kr}
    api-base-url: ${P3_KFTC_API_BASE_URL:https://openapi.openbanking.or.kr}
    client-id: ${P3_KFTC_CLIENT_ID:}
    client-secret: ${P3_KFTC_CLIENT_SECRET:}
    use-org-code: ${P3_KFTC_USE_ORG_CODE:}
    request-timeout: ${P3_KFTC_REQUEST_TIMEOUT:PT3S}
    token-refresh-skew: ${P3_KFTC_TOKEN_REFRESH_SKEW:PT30S}

  cors:
    allowed-origins: ${P3_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  websocket:
    allowed-origins: ${P3_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}

  web:
    base-url: ${P3_WEB_BASE_URL:http://localhost:3000}

  mail:
    enabled: ${P3_MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    seller-inquiries-url: ${P3_SELLER_INQUIRIES_URL:https://seller.wihada.com/seller/home?tab=waiting}

  internal:
    auth:
      token: ${P3_INTERNAL_AUTH_TOKEN:}

  asset:
    storage:
      original-asset-bucket: p3-s3-original-dev
      processed-asset-bucket: p3-s3-processed-dev
    delivery:
      base-url: ${P3_DELIVERY_BASE_URL:}

  point3:
    api-base-url: ${P3_POINT3_API_BASE_URL:https://api.point3.io}
    auth-base-url: ${P3_POINT3_AUTH_BASE_URL:https://auth.point3.io}
    payment-origin: ${P3_POINT3_PAYMENT_ORIGIN:https://widget.point3.io}
    client-id: ${P3_POINT3_CLIENT_ID:}
    api-token: ${P3_POINT3_API_TOKEN:}
    session-ttl: ${P3_POINT3_SESSION_TTL:PT24H}

  juso-search:
    base-url: ${P3_JUSO_SEARCH_BASE_URL:https://business.juso.go.kr/addrlink/addrLinkApi.do}
    api-key: ${P3_JUSO_SEARCH_API_KEY:}
    count-per-page: ${P3_JUSO_SEARCH_COUNT_PER_PAGE:10}
    request-timeout: ${P3_JUSO_SEARCH_REQUEST_TIMEOUT:PT3S}
